<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <title>The Next Ball — Master Logo</title>
  <desc>Vector master logo without trademark symbol.</desc>
  <rect width="1600" height="1000" fill="none"/>

  <!-- Wordmark -->
  <g fill="#132033" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900"
     text-anchor="middle">
    <text x="610" y="260" font-size="210" letter-spacing="-10">THE</text>
    <text x="610" y="465" font-size="210" letter-spacing="-10">NEXT</text>
    <text x="610" y="670" font-size="210" letter-spacing="-10">BALL</text>
  </g>

  <!-- Bounce trajectory -->
  <path d="M945 310
           C1040 305 1090 355 1122 425
           C1144 474 1156 528 1170 585
           C1180 625 1190 650 1202 664
           C1214 645 1228 628 1248 612"
        fill="none" stroke="#132033" stroke-width="20"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Ball -->
  <circle cx="1322" cy="594" r="92" fill="#C7F238"/>
  <g fill="#132033">
    <ellipse cx="1290" cy="532" rx="13" ry="18" transform="rotate(55 1290 532)"/>
    <ellipse cx="1342" cy="520" rx="12" ry="18" transform="rotate(-20 1342 520)"/>
    <ellipse cx="1378" cy="552" rx="12" ry="18" transform="rotate(-45 1378 552)"/>
    <ellipse cx="1264" cy="580" rx="12" ry="18" transform="rotate(15 1264 580)"/>
    <circle cx="1320" cy="574" r="13"/>
    <ellipse cx="1376" cy="602" rx="12" ry="18" transform="rotate(20 1376 602)"/>
    <ellipse cx="1278" cy="632" rx="12" ry="18" transform="rotate(-35 1278 632)"/>
    <circle cx="1334" cy="640" r="13"/>
    <ellipse cx="1380" cy="650" rx="11" ry="17" transform="rotate(45 1380 650)"/>
  </g>

  <!-- Ground shadow / bounce point -->
  <ellipse cx="1205" cy="690" rx="54" ry="10" fill="#132033"/>

  <!-- Tagline -->
  <text x="800" y="815" fill="#132033"
        font-family="Arial, Helvetica, sans-serif" font-size="48"
        font-weight="600" text-anchor="middle" letter-spacing="12">
    BETTER DECISIONS, ONE POINT AT A TIME.
  </text>
</svg>
